services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fileflow}
      POSTGRES_USER: ${POSTGRES_USER:-fileflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileflow_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - media_data:/app/media
    env_file: .env
    depends_on:
      - web
      - redis
      - db

volumes:
  postgres_data:
  media_data:
